[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhibition-archive"
version = "0.1.0"
description = "Local-first exhibition capture-to-archive workflow engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
exhibition-archive = "exhibition_archive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exhibition_archive = ["imageio_heic.swift"]
